
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CubeHub{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #222;
        }

        header {
            background-color: #172554;
            color: white;
            padding: 18px 30px;
        }

        header h1 {
            margin: 0 0 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 24px;
            background-color: white;
            border-radius: 8px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #e8edf7;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>
    <header>
        <h1>CubeHub</h1>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'solve_list' %}">Solves</a>
            <a href="{% url 'cuber_list' %}">Cubers</a>
            <a href="{% url 'cube_list' %}">Cubes</a>
            <a href="/admin/">Admin</a>

        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        CubeHub &copy; {% now "Y" %}
    </footer>
</body>
</html>
